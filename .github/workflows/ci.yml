name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The unit suite cannot see a manifest Chrome rejects, a storage method
      # Chrome does not have, or a popup that collapses on open. This loads the
      # built extension into the Chrome preinstalled on the runner and checks.
      - run: npm run verify:chrome
