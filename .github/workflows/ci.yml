name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Chromium rather than the runner's Google Chrome: Chrome refuses content
      # verification for an unpacked extension and disables its APIs instead of
      # failing to load, which reads as a dozen unrelated failures.
      - run: npx playwright install --with-deps chromium
      # Point the harness at that Chromium explicitly. The runner also has
      # Google Chrome preinstalled, and current stable Chrome ignores
      # --load-extension, so letting the harness discover a browser would
      # silently pick the one that cannot load an unpacked extension.
      - run: echo "MISE_CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      # The unit suite cannot see a manifest Chrome rejects, a storage method
      # Chrome does not have, or a popup that collapses on open.
      - run: npm run verify:chrome
